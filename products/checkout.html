<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Content-Language" content="en">
    <meta name="google" content="notranslate">

    <title>VATREX — Checkout</title>

    <link rel="stylesheet" href="../css/checkout.css">

<body>

    <main class="checkout-page">

        <!-- Background glow -->
        <div class="ambient-glow glow-one"></div>
        <div class="ambient-glow glow-two"></div>

        <!-- Header -->
        <header class="checkout-header">

            <a href="../index.html" class="logo-container">
                <img
                    src="../images/VATREXX.webp"
                    class="logo"
                    alt="VATREX"
                >
            </a>

            <div class="header-line"></div>

            <p class="checkout-label">CHECKOUT</p>

        </header>


        <!-- Main Card -->
        <section class="checkout-card">

            <div class="checkout-intro">

                <span class="eyebrow">VATREX / ORDER</span>

                <h1>Complete your order.</h1>

                <p>
                    Enter your details below and we'll take care of the rest.
                </p>

            </div>


            <form id="checkoutForm">

                <!-- Personal Information -->
                <div class="form-section">

                    <div class="section-heading">
                        <span class="section-number">01</span>

                        <div>
                            <h2>Contact</h2>
                            <p>Your contact information</p>
                        </div>
                    </div>


                    <div class="field">

                        <label for="fullname">Full Name</label>

                        <input
                            id="fullname"
                            type="text"
                            name="fullname"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="email">Email</label>

                        <input
                            id="email"
                            type="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="phone">Phone Number</label>

                        <input
                            id="phone"
                            type="tel"
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="quantity">Quantity</label>

                        <select
                            id="quantity"
                            name="quantity"
                            required
                        >

                            <option value="">Select quantity</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>

                        </select>

                    </div>

                </div>


                <!-- Shipping -->
                <div class="form-section">

                    <div class="section-heading">

                        <span class="section-number">02</span>

                        <div>
                            <h2>Shipping</h2>
                            <p>Where should we deliver your order?</p>
                        </div>

                    </div>


                    <div class="field">

                        <label for="governorate">Governorate</label>

                        <select
                            id="governorate"
                            name="governorate"
                            required
                        >

                            <option value="">Select Governorate</option>

                            <option>Cairo</option>
                            <option>Giza</option>
                            <option>Alexandria</option>
                            <option>Qalyubia</option>
                            <option>Sharqia</option>
                            <option>Dakahlia</option>
                            <option>Beheira</option>
                            <option>Monufia</option>
                            <option>Gharbia</option>
                            <option>Kafr El Sheikh</option>
                            <option>Domyat</option>
                            <option>Port Said</option>
                            <option>Ismailia</option>
                            <option>Suez</option>
                            <option>Faiyum</option>
                            <option>Beni Suef</option>
                            <option>Minya</option>
                            <option>Assiut</option>
                            <option>Sohag</option>
                            <option>Qena</option>
                            <option>Luxor</option>
                            <option>Aswan</option>
                            <option>Red Sea</option>
                            <option>El Wadi El Gdid</option>
                            <option>Matrouh</option>
                            <option>North Sinai</option>
                            <option>South Sinai</option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="city">City / District</label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="e.g. Nasr City"
                            autocomplete="address-level2"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="street">Street Address</label>

                        <input
                            type="text"
                            id="street"
                            name="street"
                            placeholder="Street name and building number"
                            autocomplete="street-address"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="apartment">Apartment / Floor</label>

                        <input
                            type="text"
                            id="apartment"
                            name="apartment"
                            placeholder="Apartment, floor or landmark"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="postal">
                            Postal Code
                            <span class="optional">OPTIONAL</span>
                        </label>

                        <input
                            type="tel"
                            id="postal"
                            name="postal"
                            maxlength="5"
                            placeholder="e.g. 12345"
                            inputmode="numeric"
                        >

                    </div>

                </div>


                <!-- Buttons -->
                <div id="buttonbox">

                    <button
                        type="submit"
                        id="submit-order"
                    >
                        <span>Submit Order</span>
                        <span class="button-arrow">→</span>
                    </button>


                    <button
                        type="button"
                        onclick="location.href='../index.html'"
                        class="back"
                    >
                        Back
                    </button>

                </div>


                <p class="secure-note">
                    VATREX / ORDER PROCESSING
                </p>

            </form>

        </section>

    </main>


    <script src="../javascript/checkout.js"></script>

</body>
</html>
