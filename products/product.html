<!DOCTYPE html>
<html lang="en">

<head>

    <meta http-equiv="Content-Language" content="en">
    <meta name="google" content="notranslate">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap"
          rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>𐎂 VATREX 𐎂</title>

    <!-- IMPORTANT: product.html is inside /products/ -->
    <link rel="stylesheet" href="../css/style.css">

    <link rel="icon"
          href="../images/webtab.webp"
          type="image/webp">


    <!-- =====================================================
         PRODUCT PAGE EXTRA CSS
    ====================================================== -->

    <style>

        /* LOADER */

        #loader {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            opacity: 1;
            visibility: visible;
            transition:
                opacity 0.6s ease,
                visibility 0.6s ease;
        }

        #loader.loader-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-text {
            color: white;
            font-family: "Metal Mania", serif;
            font-size: clamp(25px, 5vw, 60px);
            text-align: center;
        }


        /* =================================================
           PRODUCT PAGE
        ================================================= */

        .product-page {
            width: 100%;
            min-height: 100vh;

            padding: 120px 6vw 80px;

            display: grid;

            grid-template-columns:
                minmax(0, 1.25fr)
                minmax(350px, 0.75fr);

            gap: 6vw;

            align-items: start;
        }


        /* =================================================
           PRODUCT IMAGE
        ================================================= */

        .product-gallery {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        .product-container {

            position: relative;

            width: min(600px, 45vw);

            /*
             * FORCE 1:1
             */
            aspect-ratio: 1 / 1;

            height: auto;

            background: #f1f1f1;

            border: 1px solid #d1d1d1;

            border-radius: 35px;

            overflow: hidden;

            display: flex;

            align-items: center;
            justify-content: center;

            box-shadow:
                0 15px 45px rgba(0,0,0,0.08);
        }


        /*
         * ALL PRODUCT IMAGES
         *
         * The image stays INSIDE the 1:1 box.
         * It does NOT stretch the box.
         */

        .slide {

            position: absolute;

            top: 50%;
            left: 50%;

            width: 88%;
            height: 88%;

            transform:
                translate(-50%, -50%)
                translateX(35px);

            object-fit: contain;

            object-position: center;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.45s ease,
                transform 0.45s ease,
                visibility 0.45s ease;
        }


        .slide.active {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

            transform:
                translate(-50%, -50%)
                translateX(0);
        }


        /* =================================================
           PRODUCT IMAGE SIZES
        ================================================= */

        .productss1.slide {
            width: 82%;
            height: 88%;
        }

        .products2.slide {
            width: 88%;
            height: 88%;
        }

        .products3.slide {
            width: 88%;
            height: 88%;
        }

        .productss12.slide {
            width: 85%;
            height: 88%;
        }

        .products23.slide {
            width: 85%;
            height: 88%;
        }

        .products34.slide {
            width: 85%;
            height: 88%;
        }

        .productsVWB.slide {
            width: 88%;
            height: 88%;
        }

        .productswb.slide {
            width: 88%;
            height: 88%;
        }

        .productswb2.slide {
            width: 88%;
            height: 88%;
        }

        .products22.slide {
            width: 85%;
            height: 90%;
        }

        .products33.slide {
            width: 85%;
            height: 90%;
        }

        .products44.slide {
            width: 85%;
            height: 90%;
        }


        /* =================================================
           ARROWS
        ================================================= */

        .prev,
        .next {

            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 52px;
            height: 52px;

            border: none;

            background: rgba(255,255,255,0.9);

            color: #111;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 10;

            font-size: 28px;
        }

        .prev {
            left: 18px;
        }

        .next {
            right: 18px;
        }

        .prev:hover,
        .next:hover {

            background: #111;

            color: white;
        }


        /* =================================================
           PRODUCT NAME
        ================================================= */

        .producttext {

            width: 100%;

            max-width: 600px;

            margin-top: 25px;

            text-align: center;
        }

        .producttext h1 {

            font-family: "Metal Mania", serif;

            font-size: clamp(28px, 3vw, 48px);

            font-weight: 400;

            color: #111;

            line-height: 1.1;
        }


        /* =================================================
           PRODUCT INFO
        ================================================= */

        .product-info {

            position: sticky;

            top: 110px;

            width: 100%;

            max-width: 500px;

            padding: 40px;

            background: #f3f3f3;

            border: 1px solid #d2d2d2;

            border-radius: 35px;

            box-shadow:
                0 15px 45px rgba(0,0,0,0.08);
        }


        .product-info > h1 {

            font-family: "Metal Mania", serif;

            font-size: clamp(35px, 4vw, 58px);

            font-weight: 400;

            line-height: 1;

            margin-bottom: 20px;
        }


        /* =================================================
           PRICE
        ================================================= */

        #product-price {

            font-family: "Montserrat", sans-serif;

            font-size: 28px;

            font-weight: 800;

            color: #111;

            margin-bottom: 20px;
        }


        /* =================================================
           STOCK
        ================================================= */

        .stock {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 10px;

            color: #333;

            font-size: 14px;

            font-weight: 600;
        }

        .stock span {

            color: #009b20;

            font-size: 12px;
        }


        /* =================================================
           SHIPPING
        ================================================= */

        #shipping {

            font-size: 14px;

            color: #777;

            margin-bottom: 30px;
        }


        /* =================================================
           QUANTITY
        ================================================= */

        .quantity {

            width: 150px;

            height: 55px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border: 2px solid #111;

            border-radius: 15px;

            overflow: hidden;

            margin-bottom: 20px;

            background: white;
        }

        .quantity button {

            width: 45px;

            height: 100%;

            border: none;

            background: transparent;

            color: #111;

            font-size: 25px;

            cursor: pointer;
        }

        .quantity button:hover {

            background: #111;

            color: white;
        }

        #quantity {

            font-size: 17px;

            font-weight: 800;
        }


        /* =================================================
           PRE ORDER
        ================================================= */

        .buy {

            width: 100%;

            height: 65px;

            border: 2px solid #111;

            border-radius: 18px;

            background: #111;

            color: white;

            font-family: "Montserrat", sans-serif;

            font-size: 20px;

            font-weight: 800;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                background 0.3s ease,
                transform 0.2s ease;
        }

        .buy:hover {

            background: #8b0000;

            border-color: #8b0000;

            transform: translateY(-2px);
        }


        /* =================================================
           BACK BUTTON
        ================================================= */

        .back {

            width: 100%;

            height: 60px;

            margin-top: 12px;

            border: 2px solid #111;

            border-radius: 18px;

            background: transparent;

            color: #111;

            font-family: "Montserrat", sans-serif;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;
        }

        .back:hover {

            background: #111;

            color: white;
        }


        /* =================================================
           DESCRIPTION
        ================================================= */

        .product-description {

            margin-top: 35px;

            padding-top: 30px;

            border-top: 1px solid #ccc;
        }

        .product-description h3 {

            font-family: "Metal Mania", serif;

            font-size: 24px;

            font-weight: 400;

            margin-bottom: 15px;
        }

        .product-description p {

            font-family: "Montserrat", sans-serif;

            font-size: 14px;

            line-height: 1.8;

            color: #555;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 766px) {

            .product-page {

                width: 100%;

                min-height: auto;

                padding:
                    95px
                    18px
                    40px;

                display: flex;

                flex-direction: column;

                gap: 30px;

                align-items: center;
            }


            .product-gallery {

                width: 100%;
            }


            .product-container {

                /*
                 * EXACTLY 1:1 ON MOBILE
                 */

                width: 90vw;

                height: 90vw;

                aspect-ratio: 1 / 1;

                max-width: 600px;

                max-height: 600px;

                border-radius: 28px;
            }


            .slide {

                width: 88%;

                height: 88%;

                object-fit: contain;

                object-position: center;
            }


            .productss1.slide,
            .products2.slide,
            .products3.slide,
            .productss12.slide,
            .products23.slide,
            .products34.slide,
            .productsVWB.slide,
            .productswb.slide,
            .productswb2.slide {

                width: 88%;

                height: 88%;
            }


            .products22.slide,
            .products33.slide,
            .products44.slide {

                width: 85%;

                height: 90%;
            }


            .prev,
            .next {

                width: 45px;

                height: 45px;

                font-size: 23px;
            }


            .prev {
                left: 10px;
            }

            .next {
                right: 10px;
            }


            .producttext {

                margin-top: 18px;

                padding: 0 10px;
            }


            .producttext h1 {

                font-size: 30px;
            }


            .product-info {

                position: static;

                width: 100%;

                max-width: none;

                padding: 25px 22px;

                border-radius: 25px;
            }


            .product-info > h1 {

                font-size: 38px;

                line-height: 1.05;

                margin-bottom: 15px;
            }


            #product-price {

                font-size: 24px;

                margin-bottom: 15px;
            }


            .buy {

                height: 62px;

                font-size: 18px;

                border-radius: 16px;
            }


            .back {

                height: 55px;

                border-radius: 16px;
            }

        }


        /* =================================================
           VERY SMALL PHONES
        ================================================= */

        @media (max-width: 400px) {

            .product-container {

                width: 94vw;

                height: 94vw;

                aspect-ratio: 1 / 1;

                border-radius: 24px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     LOADER
====================================================== -->

<div id="loader">

    <div class="loader-text">
        Forging Darkness...
    </div>

</div>



<!-- =====================================================
     NAVBAR
====================================================== -->

<nav class="navbar">


    <div class="nav-left">

        <i class="fa-solid fa-bars"
           onclick="openMenu()">
        </i>

    </div>


    <div id="sidebar"
         class="sidebar">


        <button class="close-btn"
                onclick="closeMenu()">

            &times;

        </button>


        <a href="../index.html">
            HOME
        </a>


        <a href="../category/tops.html">
            TOPS
        </a>


        <a href="../category/pants.html">
            PANTS
        </a>


    </div>


    <div id="overlay"
         class="overlay"
         onclick="closeMenu()">
    </div>


    <div class="nav-center">

        <img src="../images/VATREXX.webp"
             alt="VATREX Logo">

    </div>


    <div class="nav-right">

        <a href="https://www.tiktok.com/@..vatrex">

            <img src="../images/tiktok.webp"
                 alt="TikTok">

        </a>

    </div>


</nav>



<!-- =====================================================
     PRODUCT PAGE
====================================================== -->

<main class="product-page">


    <!-- =================================================
         PRODUCT GALLERY
    ================================================== -->

    <section class="product-gallery">


        <div class="product-container"
             id="product-gallery">


            <button class="prev"
                    id="prev">

                <i class="fa-solid fa-chevron-left"></i>

            </button>


            <!-- PRODUCT IMAGES GET INSERTED HERE BY JS -->


            <button class="next"
                    id="next">

                <i class="fa-solid fa-chevron-right"></i>

            </button>


        </div>


        <div class="producttext">

            <h1 id="gallery-product-name">
                Loading...
            </h1>

        </div>


    </section>



    <!-- =================================================
         PRODUCT INFORMATION
    ================================================== -->

    <section class="product-info">


        <h1 id="product-name">
            Loading...
        </h1>


        <div id="product-price">
            £0.00
        </div>


        <div class="stock">

            <i class="fa-solid fa-circle"></i>

            <span>
                PRE ORDER
            </span>

        </div>


        <p id="shipping">
            Shipping calculated at checkout.
        </p>



        <!-- QUANTITY -->

        <div class="quantity">

            <button id="minus"
                    type="button">

                −

            </button>


            <span id="quantity">
                1
            </span>


            <button id="plus"
                    type="button">

                +

            </button>

        </div>



        <!-- PRE ORDER BUTTON -->

        <button class="buy"
                id="preorder"
                type="button">

            PRE ORDER

        </button>



        <!-- BACK BUTTON -->

        <button class="back"
                id="back"
                type="button">

            ← BACK

        </button>



        <!-- DESCRIPTION -->

        <div class="product-description">


            <h3>
                DESCRIPTION
            </h3>


            <p id="product-description-text">
                Loading product information...
            </p>


        </div>


    </section>


</main>



<!-- =====================================================
     PRODUCT JS
====================================================== -->

<script src="../javascript/products.js"></script>



<!-- =====================================================
     MENU + LOADER
====================================================== -->

<script>

function openMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    if (sidebar) {

        sidebar.style.left = "0";

    }


    if (overlay) {

        overlay.style.display = "block";

    }

}



function closeMenu() {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    if (sidebar) {

        sidebar.style.left = "-300px";

    }


    if (overlay) {

        overlay.style.display = "none";

    }

}



/* =====================================================
   LOADER
====================================================== */

(function () {


    function hideLoader() {

        const loader =
            document.getElementById("loader");


        if (!loader) {

            return;

        }


        loader.classList.add(
            "loader-hidden"
        );


        setTimeout(function () {

            if (loader) {

                loader.remove();

            }

        }, 700);

    }


    window.addEventListener(
        "load",
        function () {

            hideLoader();

        }
    );


    setTimeout(
        function () {

            hideLoader();

        },
        3000
    );


})();

</script>


</body>

</html>
